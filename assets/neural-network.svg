<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Animated neural network forward pass" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2027"/><stop offset="1" stop-color="#203a43"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#00d4ff" stop-opacity=".9"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
<style>
.e{stroke:#00d4ff;stroke-opacity:.12;stroke-width:1}
.f{stroke:#00d4ff;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:6 90;fill:none;animation:flow 3.6s linear infinite}
@keyframes flow{from{stroke-dashoffset:96;opacity:0}10%{opacity:1}90%{opacity:1}to{stroke-dashoffset:0;opacity:0}}
.n{fill:#0f2027;stroke:#00d4ff;stroke-width:2;animation:pulse 3.6s ease-in-out infinite}
@keyframes pulse{0%,100%{fill:#0f2027}15%{fill:#00d4ff}35%{fill:#0f2027}}
.o{fill:#0f2027;stroke:#7cffcb;stroke-width:2;animation:pulse2 3.6s ease-in-out infinite}
@keyframes pulse2{0%,60%,100%{fill:#0f2027}80%{fill:#7cffcb}}
text{font-family:'JetBrains Mono',Consolas,monospace;fill:#8fb8c4;font-size:11px;letter-spacing:2px}
.t{fill:#e6faff;font-size:13px;letter-spacing:1px}
</style>
</defs>
<rect width="880" height="300" rx="18" fill="url(#bg)"/>
<text x="24" y="30" class="t">forward_pass()  →  loss.backward()  →  repeat</text>

