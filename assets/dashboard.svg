<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Animated analytics dashboard" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2027"/><stop offset="1" stop-color="#203a43"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#0a6c8a"/></linearGradient>
<style>
text{font-family:'JetBrains Mono',Consolas,monospace;fill:#8fb8c4;font-size:11px}
.h{fill:#e6faff;font-size:13px;letter-spacing:1px}
.card{fill:#0b1a20;stroke:#00d4ff;stroke-opacity:.25}
.bar{fill:url(#bar);transform-box:fill-box;transform-origin:50% 100%;animation:grow 5s ease-out infinite}
@keyframes grow{0%{transform:scaleY(0)}25%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.line{fill:none;stroke:#7cffcb;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;animation:draw 5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:100}45%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
.ring{fill:none;stroke:#00d4ff;stroke-width:12;stroke-linecap:round;stroke-dasharray:0 100;transform:rotate(-90deg);transform-origin:50% 50%;transform-box:fill-box;animation:fill 5s ease-out infinite}
@keyframes fill{0%{stroke-dasharray:0 100}40%,88%{stroke-dasharray:23 100}100%{stroke-dasharray:0 100}}
.dot{fill:#7cffcb;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.k{animation:fadein 5s ease-out infinite}
@keyframes fadein{0%{opacity:0}20%,88%{opacity:1}100%{opacity:0}}
</style>
</defs>
